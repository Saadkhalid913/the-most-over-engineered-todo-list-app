services:
  db:
    image: mariadb:11
    container_name: todo-mariadb
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: todos
      MYSQL_USER: todos
      MYSQL_PASSWORD: todos
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - todo_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  todo_mariadb_data:
